<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every brand Empire Distributors Group carries - premium names in vape, kratom, delta, mushroom, pseudo, blue lotus, and supplements.">
    <meta name="theme-color" content="#1a3a5c">
    <title>Brands - Empire Distributors Group</title>

    <link rel="icon" type="image/png" href="../assets/logos/empire-logo.png">
    <link rel="apple-touch-icon" href="../assets/logos/empire-logo.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Empire Distributors Group">
    <meta property="og:title" content="Brands - Empire Distributors Group">
    <meta property="og:description" content="Every brand we carry - premium names in vape, kratom, delta, mushroom, pseudo, blue lotus, and supplements.">
    <meta property="og:image" content="../assets/logos/empire-logo.png">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Mona+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

    <div id="site-header"></div>

    <main>
        <!-- Compact brands header -->
        <section class="cat-header">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../index.html">Home</a>
                    <span class="breadcrumb__sep">/</span>
                    <span>Brands</span>
                </nav>
                <div class="cat-header__row">
                    <div>
                        <h1>All Brands</h1>
                        <div class="cat-header__count" id="brands-count"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Category filter -->
        <section class="cat-filter-row">
            <div class="container">
                <div class="cat-filter__chips" id="brands-filter">
                    <button class="chip active" data-cat="all">All</button>
                </div>
            </div>
        </section>

        <!-- Brands grid -->
        <section class="section">
            <div class="container">
                <div id="brands-grid" class="brands-grid"></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/age-gate.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/catalog.js"></script>
    <script>
    (function () {
        const { loadData, findCategory, getProductsByCompany, wireReveal, wireWhatsapp,
                escapeHtml, BASE } = window.EDG;

        loadData().then(data => {
            renderCatNav(data);
            renderFilter(data);
            renderBrands(data, 'all');
            const countEl = document.getElementById('brands-count');
            if (countEl) countEl.textContent = `${data.companies.length} brands`;
            wireWhatsapp();
            wireReveal();
        });

        function renderCatNav(data) {
            const el = document.getElementById('nav-bar-list');
            if (!el) return;
            el.innerHTML = `
                ${data.categories.map(c => `
                    <a class="nav-link" style="--c: var(--c-${c.id}); --c-lt: var(--c-${c.id}-lt);" href="${BASE}pages/category.html?id=${c.id}">${escapeHtml(c.name)}</a>
                `).join('')}
                <a class="nav-link active" href="${BASE}pages/brands.html">Brands</a>
                <a class="nav-link" href="${BASE}pages/about.html">About</a>
                <a class="nav-link" href="${BASE}pages/contact.html">Contact</a>
            `;
        }

        function renderFilter(data) {
            const filter = document.getElementById('brands-filter');
            data.categories.forEach(c => {
                const companyCount = data.companies.filter(co => co.category === c.id).length;
                if (companyCount === 0) return;
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.dataset.cat = c.id;
                btn.style.setProperty('--c', `var(--c-${c.id})`);
                btn.style.setProperty('--c-lt', `var(--c-${c.id}-lt)`);
                btn.textContent = c.name;
                filter.appendChild(btn);
            });
            filter.addEventListener('click', e => {
                const b = e.target.closest('.chip');
                if (!b) return;
                filter.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                b.classList.add('active');
                renderBrands(data, b.dataset.cat);
            });
        }

        function renderBrands(data, catFilter) {
            const grid = document.getElementById('brands-grid');
            const brands = catFilter === 'all'
                ? data.companies
                : data.companies.filter(c => c.category === catFilter);

            grid.innerHTML = brands.map(b => {
                const cat = findCategory(data, b.category);
                const products = getProductsByCompany(data, b.id);
                const sampleImg = products[0]?.image || '';
                const logoSrc = b.logo ? `${BASE}${b.logo}` : '';
                const style = `--c: var(--c-${b.category}); --c-lt: var(--c-${b.category}-lt);`;
                const catHref = `${BASE}pages/category.html?id=${b.category}`;

                // Show brand logo if available, else fallback to sample product image / initial
                const mediaInner = logoSrc
                    ? `<img class="brand-card__logo" src="${logoSrc}" alt="${escapeHtml(b.name)} logo" loading="lazy">`
                    : sampleImg
                        ? `<img src="${sampleImg}" alt="" loading="lazy">`
                        : `<div class="brand-card__placeholder">${escapeHtml(b.name[0])}</div>`;

                return `
                    <a class="brand-card reveal ${logoSrc ? 'has-logo' : ''}" id="${escapeHtml(b.id)}" style="${style}" href="${catHref}">
                        <div class="brand-card__media">
                            ${mediaInner}
                        </div>
                        <div class="brand-card__body">
                            <div class="brand-card__cat">${escapeHtml(cat ? cat.name : '')}</div>
                            <h3 class="brand-card__name">${escapeHtml(b.name)}</h3>
                                                    </div>
                        <div class="brand-card__arrow" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                        </div>
                    </a>
                `;
            }).join('');

            wireReveal();

            // Support #brand-id deep link
            if (location.hash) {
                const el = document.getElementById(location.hash.slice(1));
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    })();
    </script>
    <script src="../js/search.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
