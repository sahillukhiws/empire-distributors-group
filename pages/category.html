<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse premium products by category at Empire Distributors Group.">
    <meta name="theme-color" content="#ffffff">
    <title id="page-title">Category - Empire Distributors Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Mona+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

    <!-- Header injected -->
    <div id="site-header"></div>

    <!-- Category page content -->
    <main id="category-main">
        <!-- CATEGORY HERO BANNER -->
        <section class="cat-hero" id="cat-hero">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../index.html">Home</a>
                    <span class="breadcrumb__sep">/</span>
                    <span id="bc-current">Category</span>
                </nav>

                <div class="cat-hero__grid">
                    <div class="cat-hero__text">
                        <div class="cat-hero__icon" id="cat-hero-icon"></div>
                        <h1 id="cat-hero-title">Loading…</h1>
                        <p class="cat-hero__tagline" id="cat-hero-tagline"></p>
                        <p class="cat-hero__desc" id="cat-hero-desc"></p>
                        <ul class="cat-hero__bullets" id="cat-hero-bullets"></ul>
                        <div class="cat-hero__cta">
                            <a class="btn btn-primary" href="#products">
                                Browse Products
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                            </a>
                            <a class="btn btn-ghost" id="cat-hero-wa">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3A7.8 7.8 0 0 0 12 4a7.9 7.9 0 0 0-6.7 12L4 20.9l5-1.3a7.9 7.9 0 0 0 11.9-6.8 7.8 7.8 0 0 0-2.3-5.5z"/></svg>
                                Wholesale Inquiry
                            </a>
                        </div>
                    </div>
                    <div class="cat-hero__stats" id="cat-hero-stats"></div>
                </div>
            </div>
        </section>

        <!-- FILTER + PRODUCT GRID -->
        <section class="section" id="products">
            <div class="container">
                <div class="cat-filter">
                    <div class="cat-filter__head">
                        <div>
                            <span class="eyebrow" id="filter-eyebrow">All products</span>
                            <h2 class="cat-filter__title">Shop the <span id="filter-cat-name">Category</span> Collection</h2>
                        </div>
                        <div class="cat-filter__count" id="filter-count"></div>
                    </div>
                    <div class="cat-filter__chips" id="brand-chips"></div>
                </div>
                <div id="products-grid" class="prod-grid"></div>
            </div>
        </section>

        <!-- CROSS-SELL: other categories -->
        <section class="cross-sell">
            <div class="container">
                <div class="section-head">
                    <div>
                        <span class="eyebrow">Keep exploring</span>
                        <h2>Other <span>Categories</span></h2>
                        <p>Continue browsing the Empire catalog - every line is curated, stocked, and ready to ship.</p>
                    </div>
                    <a class="cross-sell__viewall" href="../index.html">
                        Back to Home
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div id="cross-sell-grid" class="cat-grid"></div>
            </div>
        </section>
    </main>

    <!-- Footer injected -->
    <div id="site-footer"></div>

    <script src="../js/age-gate.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/catalog.js"></script>
    <script>
    /* ---------- Category page controller ---------- */
    (function () {
        const { loadData, ICONS, CAT_COPY, findCategory, getProductsByCategory, getBrandsInCategory,
                renderProductGrid, renderProductCard, wireReveal, wireWhatsapp, waLink,
                escapeHtml, qs, BASE } = window.EDG;

        const catId = qs('id');

        loadData().then(data => {
            // Fill category nav pills (reused from home)
            renderCatNav(data);

            const cat = findCategory(data, catId);
            if (!cat) {
                document.getElementById('category-main').innerHTML = `
                    <section class="section"><div class="container">
                        <div class="empty-state">
                            <h2>Category not found</h2>
                            <p>That category doesn't exist. <a href="${BASE}index.html">Return home</a>.</p>
                        </div>
                    </div></section>
                `;
                wireWhatsapp();
                return;
            }

            renderHero(data, cat);
            renderBrandFilter(data, cat);
            renderCrossSell(data, cat);
            filterAndRender(data, cat, 'all');

            document.getElementById('page-title').textContent = `${cat.name} - Empire Distributors Group`;
            document.getElementById('bc-current').textContent = cat.name;
            document.getElementById('filter-cat-name').textContent = cat.name;

            wireWhatsapp();
            wireReveal();
        });

        function renderCatNav(data) {
            const el = document.getElementById('nav-bar-list');
            if (!el) return;
            el.innerHTML = `
                ${data.categories.map(c => `
                    <a class="nav-link" style="--c: var(--c-${c.id}); --c-lt: var(--c-${c.id}-lt);" href="${BASE}pages/category.html?id=${c.id}">${escapeHtml(c.name)}</a>
                `).join('')}
                <a class="nav-link" href="${BASE}pages/brands.html">Brands</a>
                <a class="nav-link" href="${BASE}pages/about.html">About</a>
                <a class="nav-link" href="${BASE}pages/contact.html">Contact</a>
            `;
        }

        function renderHero(data, cat) {
            const hero = document.getElementById('cat-hero');
            hero.style.setProperty('--c', `var(--c-${cat.id})`);
            hero.style.setProperty('--c-lt', `var(--c-${cat.id}-lt)`);
            hero.classList.add('is-ready');

            document.getElementById('cat-hero-icon').innerHTML = ICONS[cat.id] || '';
            document.getElementById('cat-hero-title').textContent = cat.name;

            const copy = CAT_COPY[cat.id] || { tagline: '', description: '', bullets: [] };
            document.getElementById('cat-hero-tagline').textContent = copy.tagline;
            document.getElementById('cat-hero-desc').textContent = copy.description;

            const bulletsEl = document.getElementById('cat-hero-bullets');
            bulletsEl.innerHTML = copy.bullets.map(b => `
                <li>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    ${escapeHtml(b)}
                </li>
            `).join('');

            const products = getProductsByCategory(data, cat.id);
            const brands = getBrandsInCategory(data, cat.id);
            document.getElementById('cat-hero-stats').innerHTML = `
                <div class="cat-stat">
                    <div class="cat-stat__num">${products.length}</div>
                    <div class="cat-stat__lbl">Products</div>
                </div>
                <div class="cat-stat">
                    <div class="cat-stat__num">${brands.length}</div>
                    <div class="cat-stat__lbl">Brands</div>
                </div>
                <div class="cat-stat">
                    <div class="cat-stat__num">24/7</div>
                    <div class="cat-stat__lbl">WhatsApp</div>
                </div>
            `;

            const wa = document.getElementById('cat-hero-wa');
            wa.setAttribute('data-wa', `Hi, I'd like wholesale info for the ${cat.name} category.`);
        }

        function renderBrandFilter(data, cat) {
            const brands = getBrandsInCategory(data, cat.id);
            const chipsEl = document.getElementById('brand-chips');
            const products = getProductsByCategory(data, cat.id);

            let html = `<button class="chip active" data-brand="all">All (${products.length})</button>`;
            brands.forEach(b => {
                const count = products.filter(p => p.company === b.id).length;
                html += `<button class="chip" data-brand="${b.id}">${escapeHtml(b.name)} (${count})</button>`;
            });
            chipsEl.innerHTML = html;

            chipsEl.addEventListener('click', e => {
                const btn = e.target.closest('.chip');
                if (!btn) return;
                chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                filterAndRender(data, cat, btn.dataset.brand);
            });
        }

        function filterAndRender(data, cat, brandFilter) {
            const all = getProductsByCategory(data, cat.id);
            const filtered = brandFilter === 'all' ? all : all.filter(p => p.company === brandFilter);
            const grid = document.getElementById('products-grid');
            renderProductGrid(filtered, data, grid, { showChip: false, fullCard: true, emptyText: 'No products from this brand yet.' });
            document.getElementById('filter-count').textContent =
                `Showing ${filtered.length} of ${all.length}`;
            wireReveal();
            wireWhatsapp();
        }

        function renderCrossSell(data, currentCat) {
            const others = data.categories.filter(c => c.id !== currentCat.id);
            const grid = document.getElementById('cross-sell-grid');
            grid.innerHTML = others.map(c => {
                const count = getProductsByCategory(data, c.id).length;
                const style = `--c: var(--c-${c.id}); --c-lt: var(--c-${c.id}-lt);`;
                return `
                    <a class="cat-card reveal" style="${style}" href="${BASE}pages/category.html?id=${c.id}">
                        <div class="cat-card__icon">${ICONS[c.id] || ''}</div>
                        <div class="cat-card__body">
                            <div class="cat-card__name">${escapeHtml(c.name)}</div>
                            <div class="cat-card__count">${count} products</div>
                        </div>
                        <div class="cat-card__arrow" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                        </div>
                    </a>
                `;
            }).join('');
        }
    })();
    </script>
    <script src="../js/search.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
