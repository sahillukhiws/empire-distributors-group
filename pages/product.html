<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product details - Empire Distributors Group.">
    <meta name="theme-color" content="#1a3a5c">
    <title id="page-title">Product - Empire Distributors Group</title>

    <link rel="icon" type="image/png" href="../assets/logos/empire-logo.png">
    <link rel="apple-touch-icon" href="../assets/logos/empire-logo.png">

    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Empire Distributors Group">
    <meta property="og:title" content="Product - Empire Distributors Group">
    <meta property="og:description" content="Wholesale product details - inquire via WhatsApp.">
    <meta property="og:image" content="../assets/logos/empire-logo.png">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Mona+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

    <div id="site-header"></div>

    <main id="product-main">
        <section class="section product-detail" id="product-detail">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../index.html">Home</a>
                    <span class="breadcrumb__sep">/</span>
                    <a id="bc-category" href="#">Category</a>
                    <span class="breadcrumb__sep">/</span>
                    <span id="bc-product">Product</span>
                </nav>

                <div class="pd-grid" id="pd-grid">
                    <div class="pd-media">
                        <div class="pd-media__frame" id="pd-media-frame">
                            <span class="pd-chip" id="pd-chip">Category</span>
                            <img id="pd-image" src="" alt="">
                            <div class="pd-lens" id="pd-lens" aria-hidden="true"></div>
                        </div>
                    </div>

                    <div class="pd-info">
                        <div class="pd-brand" id="pd-brand"></div>
                        <h1 class="pd-name" id="pd-name">Loading…</h1>
                        <div class="pd-meta">
                            <div class="pd-meta__row">
                                <span class="pd-meta__lbl">SKU</span>
                                <span class="pd-meta__val" id="pd-sku">-</span>
                            </div>
                            <div class="pd-meta__row">
                                <span class="pd-meta__lbl">Category</span>
                                <span class="pd-meta__val" id="pd-category-name">-</span>
                            </div>
                            <div class="pd-meta__row">
                                <span class="pd-meta__lbl">Availability</span>
                                <span class="pd-meta__val pd-meta__val--ok">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                    In stock
                                </span>
                            </div>
                        </div>

                        <p class="pd-description" id="pd-description"></p>

                        <div class="pd-features" id="pd-features" hidden>
                            <h4>Product Highlights</h4>
                            <ul id="pd-features-list"></ul>
                        </div>

                        <div class="pd-cta">
                            <a class="btn btn-primary pd-cta__main" id="pd-wa-main">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3A7.8 7.8 0 0 0 12 4a7.9 7.9 0 0 0-6.7 12L4 20.9l5-1.3a7.9 7.9 0 0 0 11.9-6.8 7.8 7.8 0 0 0-2.3-5.5z"/></svg>
                                Inquire on WhatsApp
                            </a>
                            <a class="btn btn-ghost" id="pd-cta-category">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                Back
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- RELATED PRODUCTS -->
        <section class="section section--white">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-head__title">Related Products</h2>
                </div>
                <div id="related-grid" class="product-grid"></div>
            </div>
        </section>

        <!-- Full-screen image lightbox -->
        <div class="pd-lightbox" id="pd-lightbox" role="dialog" aria-modal="true" aria-label="Product image">
            <button class="pd-lightbox__close" id="pd-lightbox-close" aria-label="Close">&times;</button>
            <img class="pd-lightbox__img" id="pd-lightbox-img" src="" alt="">
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/age-gate.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/catalog.js"></script>
    <script>
    /* ---------- Product detail page controller ---------- */
    (function () {
        const { loadData, findProduct, findCategory, findCompany, getRelatedProducts,
                generateDescription, generateFeatures,
                renderProductGrid, wireReveal, wireWhatsapp, waLink,
                escapeHtml, qs, BASE } = window.EDG;

        const prodId = qs('id');

        loadData().then(data => {
            renderCatNav(data);

            const p = findProduct(data, prodId);
            if (!p) {
                document.getElementById('product-main').innerHTML = `
                    <section class="section"><div class="container">
                        <div class="empty-state">
                            <h2>Product not found</h2>
                            <p>That product doesn't exist. <a href="${BASE}index.html">Return home</a>.</p>
                        </div>
                    </div></section>
                `;
                wireWhatsapp();
                return;
            }

            const cat = findCategory(data, p.category);
            const brand = findCompany(data, p.company);

            // Set category color on detail page
            const detail = document.getElementById('product-detail');
            detail.style.setProperty('--c', `var(--c-${p.category})`);
            detail.style.setProperty('--c-lt', `var(--c-${p.category}-lt)`);

            // Fill in data
            document.getElementById('page-title').textContent = `${p.name} - Empire Distributors Group`;
            document.getElementById('pd-image').src = p.image;
            document.getElementById('pd-image').alt = p.name;
            document.getElementById('pd-chip').textContent = cat ? cat.name : '';
            document.getElementById('pd-name').textContent = p.name;
            // Show brand logo if available, else just the brand name
            const pdBrand = document.getElementById('pd-brand');
            if (brand && brand.logo) {
                pdBrand.innerHTML = `<img class="pd-brand__logo" src="${BASE}${brand.logo}" alt="${escapeHtml(brand.name)}" loading="lazy"><span>${escapeHtml(brand.name)}</span>`;
                pdBrand.classList.add('has-logo');
            } else {
                pdBrand.textContent = brand ? brand.name : '';
            }
            document.getElementById('pd-sku').textContent = p.sku;
            document.getElementById('pd-category-name').textContent = cat ? cat.name : '';

            // Description + feature highlights (auto-generated unless product has overrides)
            document.getElementById('pd-description').textContent = generateDescription(p, data);
            const features = generateFeatures(p, data);
            if (features && features.length) {
                const featEl = document.getElementById('pd-features');
                const listEl = document.getElementById('pd-features-list');
                listEl.innerHTML = features.map(f =>
                    '<li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>' + escapeHtml(f) + '</span></li>'
                ).join('');
                featEl.hidden = false;
            }

            const catName = cat ? cat.name : 'premium';

            // Breadcrumb category link
            const bcCat = document.getElementById('bc-category');
            bcCat.textContent = cat ? cat.name : 'Category';
            bcCat.href = cat ? `${BASE}pages/category.html?id=${cat.id}` : '#';
            document.getElementById('bc-product').textContent = p.name;

            // CTAs
            document.getElementById('pd-wa-main').href = waLink(
                `Inquiry: ${p.name} (SKU: ${p.sku}). I'd like pricing and availability for this ${catName} product.`
            );
            document.getElementById('pd-wa-main').target = '_blank';
            document.getElementById('pd-wa-main').rel = 'noopener';

            document.getElementById('pd-cta-category').href = cat ? `${BASE}pages/category.html?id=${cat.id}` : `${BASE}index.html`;

            // Related products
            const related = getRelatedProducts(data, p, 4);
            renderProductGrid(related, data, document.getElementById('related-grid'));

            // Lens-zoom + lightbox for main product image
            wireLensAndLightbox(p.image, p.name);

            wireWhatsapp();
            wireReveal();
        });

        /* Lens-zoom on hover (desktop) + click-to-open lightbox.
           Lens size & magnification are responsive. Touch devices skip the lens and go straight to lightbox. */
        function wireLensAndLightbox(imgSrc, altText) {
            const frame = document.getElementById('pd-media-frame');
            const img = document.getElementById('pd-image');
            const lens = document.getElementById('pd-lens');
            const lightbox = document.getElementById('pd-lightbox');
            const lightboxImg = document.getElementById('pd-lightbox-img');
            const lightboxClose = document.getElementById('pd-lightbox-close');
            if (!frame || !img || !lens || !lightbox) return;

            const ZOOM = 2.5;
            const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

            function lensSize() {
                const cs = getComputedStyle(lens);
                return { w: parseFloat(cs.width) || 160, h: parseFloat(cs.height) || 160 };
            }

            // Preload natural dims so background sizing is correct
            function setupLensBackground() {
                lens.style.backgroundImage = 'url("' + imgSrc + '")';
                // Use rendered image box (contain-fit) for zoom mapping, not raw natural size
                const r = img.getBoundingClientRect();
                lens.style.backgroundSize = (r.width * ZOOM) + 'px ' + (r.height * ZOOM) + 'px';
            }

            function onMove(e) {
                if (!hasHover) return;
                const fr = frame.getBoundingClientRect();
                const ir = img.getBoundingClientRect();
                const { w: lw, h: lh } = lensSize();

                const x = e.clientX - fr.left;
                const y = e.clientY - fr.top;

                // Position of cursor relative to image (not frame) for zoom mapping
                const ix = e.clientX - ir.left;
                const iy = e.clientY - ir.top;

                // If cursor leaves actual image area (into letterbox whitespace), hide lens
                if (ix < 0 || iy < 0 || ix > ir.width || iy > ir.height) {
                    frame.classList.remove('lens-active');
                    return;
                }
                frame.classList.add('lens-active');

                // Clamp lens center inside frame
                const halfW = lw / 2, halfH = lh / 2;
                const lx = Math.max(halfW, Math.min(fr.width - halfW, x)) - halfW;
                const ly = Math.max(halfH, Math.min(fr.height - halfH, y)) - halfH;
                lens.style.left = lx + 'px';
                lens.style.top = ly + 'px';

                // Background offset: center the zoom on cursor within rendered image box
                const imgOffsetX = ir.left - fr.left;
                const imgOffsetY = ir.top - fr.top;
                const bgX = -(ix * ZOOM - lw / 2) - imgOffsetX * ZOOM + imgOffsetX;
                const bgY = -(iy * ZOOM - lh / 2) - imgOffsetY * ZOOM + imgOffsetY;
                lens.style.backgroundPosition = bgX + 'px ' + bgY + 'px';
            }

            function onLeave() {
                frame.classList.remove('lens-active');
            }

            function openLightbox() {
                lightboxImg.src = imgSrc;
                lightboxImg.alt = altText || '';
                lightbox.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
            function closeLightbox() {
                lightbox.classList.remove('open');
                document.body.style.overflow = '';
            }

            if (img.complete) setupLensBackground();
            else img.addEventListener('load', setupLensBackground);
            window.addEventListener('resize', setupLensBackground);

            frame.addEventListener('mousemove', onMove);
            frame.addEventListener('mouseleave', onLeave);
            frame.addEventListener('click', openLightbox);

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function (e) {
                // Click on backdrop (not the img) closes
                if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
            });
        }

        function renderCatNav(data) {
            const el = document.getElementById('nav-bar-list');
            if (!el) return;
            el.innerHTML = `
                ${data.categories.map(c => `
                    <a class="nav-link" style="--c: var(--c-${c.id}); --c-lt: var(--c-${c.id}-lt);" href="${BASE}pages/category.html?id=${c.id}">${escapeHtml(c.name)}</a>
                `).join('')}
                <a class="nav-link" href="${BASE}pages/brands.html">Brands</a>
                <a class="nav-link" href="${BASE}pages/about.html">About</a>
                <a class="nav-link" href="${BASE}pages/contact.html">Contact</a>
            `;
        }
    })();
    </script>
    <script src="../js/search.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
