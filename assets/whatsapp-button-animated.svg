<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 145 320 110" role="img" aria-label="Contact us on WhatsApp" preserveAspectRatio="xMidYMid meet" style="overflow:hidden">
  <title>WhatsApp Contact Us</title>
  <desc>Green pill button with WhatsApp icon emitting confetti particles</desc>

  <style>
    /* Confetti container setup - all particles originate from button center */
    .p { opacity: 0; }
    rect.p, polygon.p { transform-origin: 0 0; transform-box: fill-box; }

    /* SQUARES - spin while flying far */
    @keyframes sq1 {
      0%, 15% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      30% { opacity:1; transform: translate(230px, 90px) rotate(180deg) scale(1); }
      70% { opacity:1; transform: translate(180px, 50px) rotate(360deg) scale(1); }
      100% { opacity:0; transform: translate(160px, 30px) rotate(540deg) scale(0.5); }
    }
    @keyframes sq2 {
      0%, 10% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      25% { opacity:1; transform: translate(450px, 100px) rotate(-180deg) scale(1); }
      70% { opacity:1; transform: translate(510px, 70px) rotate(-340deg) scale(1); }
      100% { opacity:0; transform: translate(540px, 50px) rotate(-480deg) scale(0.5); }
    }
    @keyframes sq3 {
      0%, 20% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      40% { opacity:1; transform: translate(220px, 280px) rotate(180deg) scale(1); }
      80% { opacity:1; transform: translate(180px, 320px) rotate(340deg) scale(1); }
      100% { opacity:0; transform: translate(160px, 340px) rotate(460deg) scale(0.5); }
    }
    @keyframes sq4 {
      0%, 12% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      35% { opacity:1; transform: translate(460px, 290px) rotate(-180deg) scale(1); }
      75% { opacity:1; transform: translate(510px, 330px) rotate(-340deg) scale(1); }
      100% { opacity:0; transform: translate(540px, 355px) rotate(-460deg) scale(0.5); }
    }
    @keyframes sq5 {
      0%, 18% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      40% { opacity:1; transform: translate(340px, 70px) rotate(180deg) scale(1); }
      80% { opacity:1; transform: translate(340px, 30px) rotate(360deg) scale(1); }
      100% { opacity:0; transform: translate(340px, 10px) rotate(480deg) scale(0.5); }
    }
    @keyframes sq6 {
      0%, 15% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      40% { opacity:1; transform: translate(340px, 330px) rotate(-180deg) scale(1); }
      80% { opacity:1; transform: translate(340px, 370px) rotate(-340deg) scale(1); }
      100% { opacity:0; transform: translate(340px, 395px) rotate(-460deg) scale(0.5); }
    }
    @keyframes sq7 {
      0%, 22% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.6); }
      45% { opacity:1; transform: translate(250px, 180px) rotate(180deg) scale(1); }
      85% { opacity:1; transform: translate(200px, 170px) rotate(360deg) scale(1); }
      100% { opacity:0; transform: translate(170px, 160px) rotate(460deg) scale(0.5); }
    }

    /* DIAMONDS - pop big then shrink-rotate-dissolve */
    @keyframes dm1 {
      0%, 20% { opacity:0; transform: translate(340px, 200px) rotate(45deg) scale(0.3); }
      35% { opacity:1; transform: translate(280px, 120px) rotate(90deg) scale(1.3); }
      70% { opacity:1; transform: translate(260px, 100px) rotate(135deg) scale(0.7); }
      100% { opacity:0; transform: translate(250px, 90px) rotate(180deg) scale(0.3); }
    }
    @keyframes dm2 {
      0%, 25% { opacity:0; transform: translate(340px, 200px) rotate(45deg) scale(0.3); }
      40% { opacity:1; transform: translate(410px, 130px) rotate(90deg) scale(1.3); }
      75% { opacity:1; transform: translate(430px, 110px) rotate(135deg) scale(0.7); }
      100% { opacity:0; transform: translate(440px, 100px) rotate(180deg) scale(0.3); }
    }
    @keyframes dm3 {
      0%, 28% { opacity:0; transform: translate(340px, 200px) rotate(45deg) scale(0.3); }
      45% { opacity:1; transform: translate(290px, 280px) rotate(90deg) scale(1.3); }
      80% { opacity:1; transform: translate(270px, 300px) rotate(135deg) scale(0.7); }
      100% { opacity:0; transform: translate(260px, 310px) rotate(180deg) scale(0.3); }
    }
    @keyframes dm4 {
      0%, 32% { opacity:0; transform: translate(340px, 200px) rotate(45deg) scale(0.3); }
      50% { opacity:1; transform: translate(410px, 280px) rotate(90deg) scale(1.3); }
      85% { opacity:1; transform: translate(430px, 300px) rotate(135deg) scale(0.7); }
      100% { opacity:0; transform: translate(440px, 310px) rotate(180deg) scale(0.3); }
    }

    /* TRIANGLES - tumble/wobble path */
    @keyframes tr1 {
      0%, 20% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.5); }
      40% { opacity:1; transform: translate(210px, 150px) rotate(180deg) scale(1); }
      70% { opacity:1; transform: translate(175px, 180px) rotate(290deg) scale(1); }
      100% { opacity:0; transform: translate(150px, 200px) rotate(400deg) scale(0.4); }
    }
    @keyframes tr2 {
      0%, 28% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.5); }
      48% { opacity:1; transform: translate(470px, 150px) rotate(-180deg) scale(1); }
      78% { opacity:1; transform: translate(505px, 180px) rotate(-290deg) scale(1); }
      100% { opacity:0; transform: translate(530px, 200px) rotate(-400deg) scale(0.4); }
    }
    @keyframes tr3 {
      0%, 35% { opacity:0; transform: translate(340px, 200px) rotate(0deg) scale(0.5); }
      55% { opacity:1; transform: translate(340px, 110px) rotate(180deg) scale(1); }
      85% { opacity:1; transform: translate(340px, 75px) rotate(340deg) scale(1); }
      100% { opacity:0; transform: translate(340px, 50px) rotate(460deg) scale(0.4); }
    }

    /* CIRCLES - slow gentle float, linger and fade */
    @keyframes ci1 {
      0%, 10% { opacity:0; transform: translate(340px, 200px) scale(0.4); }
      30% { opacity:1; transform: translate(235px, 130px) scale(1); }
      75% { opacity:0.8; transform: translate(200px, 105px) scale(1); }
      100% { opacity:0; transform: translate(180px, 90px) scale(0.6); }
    }
    @keyframes ci2 {
      0%, 15% { opacity:0; transform: translate(340px, 200px) scale(0.4); }
      35% { opacity:1; transform: translate(445px, 130px) scale(1); }
      80% { opacity:0.8; transform: translate(480px, 105px) scale(1); }
      100% { opacity:0; transform: translate(500px, 90px) scale(0.6); }
    }
    @keyframes ci3 {
      0%, 20% { opacity:0; transform: translate(340px, 200px) scale(0.4); }
      45% { opacity:1; transform: translate(260px, 290px) scale(1); }
      80% { opacity:0.8; transform: translate(230px, 315px) scale(1); }
      100% { opacity:0; transform: translate(210px, 330px) scale(0.6); }
    }
    @keyframes ci4 {
      0%, 25% { opacity:0; transform: translate(340px, 200px) scale(0.4); }
      45% { opacity:1; transform: translate(440px, 290px) scale(1); }
      80% { opacity:0.8; transform: translate(470px, 315px) scale(1); }
      100% { opacity:0; transform: translate(490px, 330px) scale(0.6); }
    }

    /* ARCS - stroke draws itself then drifts away */
    @keyframes arc1 {
      0%, 10% { opacity:0; stroke-dashoffset:30; transform: translate(340px, 200px) rotate(15deg); }
      30% { opacity:1; stroke-dashoffset:0; transform: translate(200px, 120px) rotate(15deg); }
      80% { opacity:0.6; stroke-dashoffset:0; transform: translate(170px, 95px) rotate(35deg); }
      100% { opacity:0; stroke-dashoffset:0; transform: translate(155px, 80px) rotate(55deg); }
    }
    @keyframes arc2 {
      0%, 15% { opacity:0; stroke-dashoffset:30; transform: translate(340px, 200px) rotate(-15deg); }
      35% { opacity:1; stroke-dashoffset:0; transform: translate(480px, 120px) rotate(-15deg); }
      80% { opacity:0.6; stroke-dashoffset:0; transform: translate(510px, 95px) rotate(-35deg); }
      100% { opacity:0; stroke-dashoffset:0; transform: translate(525px, 80px) rotate(-55deg); }
    }
    @keyframes arc3 {
      0%, 25% { opacity:0; stroke-dashoffset:25; transform: translate(340px, 200px) rotate(180deg); }
      45% { opacity:1; stroke-dashoffset:0; transform: translate(220px, 290px) rotate(180deg); }
      85% { opacity:0.6; stroke-dashoffset:0; transform: translate(190px, 315px) rotate(200deg); }
      100% { opacity:0; stroke-dashoffset:0; transform: translate(175px, 330px) rotate(220deg); }
    }
    @keyframes arc4 {
      0%, 30% { opacity:0; stroke-dashoffset:25; transform: translate(340px, 200px) rotate(180deg); }
      50% { opacity:1; stroke-dashoffset:0; transform: translate(460px, 290px) rotate(180deg); }
      88% { opacity:0.6; stroke-dashoffset:0; transform: translate(490px, 315px) rotate(200deg); }
      100% { opacity:0; stroke-dashoffset:0; transform: translate(505px, 330px) rotate(220deg); }
    }

    /* Assign animations */
    [style*="animation-name:sq1"]  { animation: sq1  2.8s ease-out infinite; animation-delay: 0s; }
    [style*="animation-name:sq2"]  { animation: sq2  2.8s ease-out infinite; animation-delay: .3s; }
    [style*="animation-name:sq3"]  { animation: sq3  2.8s ease-out infinite; animation-delay: .6s; }
    [style*="animation-name:sq4"]  { animation: sq4  2.8s ease-out infinite; animation-delay: .9s; }
    [style*="animation-name:sq5"]  { animation: sq5  2.8s ease-out infinite; animation-delay: .2s; }
    [style*="animation-name:sq6"]  { animation: sq6  2.8s ease-out infinite; animation-delay: 1.1s; }
    [style*="animation-name:sq7"]  { animation: sq7  2.8s ease-out infinite; animation-delay: .5s; }
    [style*="animation-name:dm1"]  { animation: dm1  2.6s ease-out infinite; animation-delay: .1s; }
    [style*="animation-name:dm2"]  { animation: dm2  2.6s ease-out infinite; animation-delay: .4s; }
    [style*="animation-name:dm3"]  { animation: dm3  2.6s ease-out infinite; animation-delay: .7s; }
    [style*="animation-name:dm4"]  { animation: dm4  2.6s ease-out infinite; animation-delay: 1.0s; }
    [style*="animation-name:tr1"]  { animation: tr1  3s   ease-out infinite; animation-delay: .2s; }
    [style*="animation-name:tr2"]  { animation: tr2  3s   ease-out infinite; animation-delay: .8s; }
    [style*="animation-name:tr3"]  { animation: tr3  3s   ease-out infinite; animation-delay: 1.4s; }
    [style*="animation-name:ci1"]  { animation: ci1  3.2s ease-in-out infinite; animation-delay: 0s; }
    [style*="animation-name:ci2"]  { animation: ci2  3.2s ease-in-out infinite; animation-delay: .6s; }
    [style*="animation-name:ci3"]  { animation: ci3  3.2s ease-in-out infinite; animation-delay: 1.2s; }
    [style*="animation-name:ci4"]  { animation: ci4  3.2s ease-in-out infinite; animation-delay: 1.8s; }
    [style*="animation-name:arc1"] { animation: arc1 2.4s ease-out infinite; animation-delay: .3s; }
    [style*="animation-name:arc2"] { animation: arc2 2.4s ease-out infinite; animation-delay: .9s; }
    [style*="animation-name:arc3"] { animation: arc3 2.4s ease-out infinite; animation-delay: 1.5s; }
    [style*="animation-name:arc4"] { animation: arc4 2.4s ease-out infinite; animation-delay: 2.1s; }

    @media (prefers-reduced-motion: reduce) {
      [style*="animation-name"] { animation: none !important; opacity: 0 !important; }
    }
  </style>

  <!-- SQUARES - spin freely while flying far -->
  <rect style="animation-name:sq1" fill="#25D366" width="10" height="10" rx="1"/>
  <rect style="animation-name:sq2" fill="#25D366" width="9"  height="9"  rx="1"/>
  <rect style="animation-name:sq3" fill="#25D366" width="11" height="11" rx="1"/>
  <rect style="animation-name:sq4" fill="#25D366" width="8"  height="8"  rx="1"/>
  <rect style="animation-name:sq5" fill="#25D366" width="10" height="10" rx="1"/>
  <rect style="animation-name:sq6" fill="#25D366" width="9"  height="9"  rx="1"/>
  <rect style="animation-name:sq7" fill="#25D366" width="7"  height="7"  rx="1"/>

  <!-- DIAMONDS -->
  <rect style="animation-name:dm1" fill="#25D366" width="9"  height="9"  rx="1"/>
  <rect style="animation-name:dm2" fill="#25D366" width="10" height="10" rx="1"/>
  <rect style="animation-name:dm3" fill="#25D366" width="8"  height="8"  rx="1"/>
  <rect style="animation-name:dm4" fill="#25D366" width="9"  height="9"  rx="1"/>

  <!-- TRIANGLES -->
  <polygon style="animation-name:tr1" fill="#25D366" points="0,-6 5.2,3 -5.2,3"/>
  <polygon style="animation-name:tr2" fill="#25D366" points="0,-6 5.2,3 -5.2,3"/>
  <polygon style="animation-name:tr3" fill="#25D366" points="0,-6 5.2,3 -5.2,3"/>

  <!-- CIRCLES -->
  <circle style="animation-name:ci1" fill="#25D366" r="4.5"/>
  <circle style="animation-name:ci2" fill="#25D366" r="4"/>
  <circle style="animation-name:ci3" fill="#25D366" r="3.5"/>
  <circle style="animation-name:ci4" fill="#25D366" r="4"/>

  <!-- ARCS -->
  <path style="animation-name:arc1" fill="none" stroke="#25D366" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="30" d="M0,0 Q8,-14 18,2"/>
  <path style="animation-name:arc2" fill="none" stroke="#25D366" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="30" d="M0,0 Q8,-14 18,2"/>
  <path style="animation-name:arc3" fill="none" stroke="#25D366" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="25" d="M0,0 Q7,-12 16,2"/>
  <path style="animation-name:arc4" fill="none" stroke="#25D366" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="25" d="M0,0 Q7,-12 16,2"/>

  <!-- BUTTON -->
  <g>
    <rect x="215" y="170" width="250" height="60" rx="30" fill="#25D366"/>
    <path transform="translate(242,186) scale(1.15)" fill="#000" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.663-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51h-.57c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c0-5.445 4.454-9.888 9.904-9.888 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.888-9.882 9.888m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.333.158 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.332 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    <text x="290" y="208" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#000">Contact Us</text>
  </g>
</svg>
